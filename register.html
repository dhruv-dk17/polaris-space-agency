<!-- Registration Container -->
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
      <div class="calc-widget p-4 p-md-5 rounded">
        <h1 class="h3 font-weight-bold text-white mb-1">Create an Account</h1>
        <p class="text-muted small mb-4">Access telemetry, research papers, and launch notifications.</p>

        <!-- Sign Up Form -->
        <form id="register-form" novalidate>
          <div class="row">
            <div class="col-sm-6 mb-3"><label class="text-uppercase text-muted font-weight-bold" style="font-size:0.7rem;">First Name *</label><input type="text" id="reg-fname" class="form-control" required></div>
            <div class="col-sm-6 mb-3"><label class="text-uppercase text-muted font-weight-bold" style="font-size:0.7rem;">Last Name *</label><input type="text" id="reg-lname" class="form-control" required></div>
          </div>
          <div class="mb-3"><label class="text-uppercase text-muted font-weight-bold" style="font-size:0.7rem;">Email Address *</label><input type="email" id="reg-email" class="form-control" required></div>
          
          <!-- Password Input & Strength Meter -->
          <div class="mb-3">
            <label class="text-uppercase text-muted font-weight-bold" style="font-size:0.7rem;">Password *</label>
            <input type="password" id="reg-password" class="form-control" required minlength="8">
            <div class="strength-bar-wrap mt-2 rounded"><div id="strength-bar" class="strength-bar"></div></div>
            <div id="strength-label" class="small mt-1 text-muted"></div>
          </div>
          <div class="mb-3">
            <label class="text-uppercase text-muted font-weight-bold" style="font-size:0.7rem;">Confirm Password *</label>
            <input type="password" id="reg-confirm" class="form-control" required>
            <div class="invalid-feedback">Passwords must match.</div>
          </div>
          <div class="mb-3 d-flex align-items-center">
            <input type="checkbox" id="reg-terms" class="mr-2" required>
            <label for="reg-terms" class="text-muted small mb-0">I accept terms and research policies.</label>
          </div>
          
          <!-- Status Messages -->
          <div id="reg-success" class="d-none p-3 mb-3 border rounded text-success small" style="background:rgba(34,197,94,0.1); border-color:rgba(34,197,94,0.3);">
            Account created! Please check your inbox.
          </div>
          <button type="submit" class="btn btn-primary w-100 py-2">Create Account</button>
        </form>

        <div class="text-center mt-4 text-muted small">
          Already have an account? <a href="login.html" style="color:var(--accent); font-weight:600;">Sign in</a>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- JavaScript Dependencies -->
