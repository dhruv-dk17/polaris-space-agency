<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — Polaris Space Agency</title>
  <link rel="stylesheet" href="bootstrap4.2.1/bootstrap4.2.1/css/bootstrap.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <nav class="nav bg-dark p-2"><a class="nav-link text-white font-weight-bold" href="index.html">POLARIS</a><a class="nav-link text-light" href="about.html">About</a><a class="nav-link text-light" href="missions.html">Missions</a><a class="nav-link text-light" href="research.html">Research</a><a class="nav-link text-light" href="careers.html">Careers</a><a class="nav-link text-light" href="contact.html">Contact</a><a class="nav-link text-info ml-auto" href="login.html">Sign In</a><a class="nav-link text-warning" href="register.html">Register</a></nav>
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        <div class="calc-widget">
          <h1 class="h4 font-weight-bold text-white mb-3 text-center">Sign In</h1>
          <form id="login-form" onsubmit="return validateForm3()" novalidate>
            <div class="form-group">
              <label class="small text-muted font-weight-bold">Email Address *</label>
              <input type="email" id="login-email" class="form-control" placeholder="you@example.com">
            </div>
            <div class="form-group">
              <label class="small text-muted font-weight-bold">Password *</label>
              <input type="password" id="login-password" class="form-control" placeholder="••••••••">
            </div>
            <button type="submit" class="btn btn-primary btn-block py-2">Sign In</button>
          </form>
          <p class="text-center mt-3 text-muted small mb-0">
            No account? <a href="register.html">Create one</a>
          </p>
        </div>
      </div>
    </div>
  </div>
  <footer class="bg-dark text-white text-center p-3">&copy; 2026 Polaris Space Agency</footer>
  <script src="bootstrap4.2.1/jquery-3.7.1.min.js"></script>
  <script src="bootstrap4.2.1/bootstrap4.2.1/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
